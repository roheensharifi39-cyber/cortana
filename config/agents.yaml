# CortexAi: who's who.
# Each agent belongs to a (fictional) organization with its own domain.
# ANS name format used here: ans://v<version>.<label>.<domain>

services:
  hub:
    port: 8000
  ans_sim:
    port: 8100

agents:
  commander:
    name: Commander
    org: LaunchPad
    label: commander
    domain: launchpad.xyz
    version: 1.0.0
    port: 8001
    role: commander
    capabilities: [mission.plan]
    description: Plans missions, hires verified specialist agents and assembles the result.

  brand:
    name: Brand agent
    org: BrandStudio
    label: brand
    domain: brandstudio.xyz
    version: 1.0.0
    port: 8002
    role: vendor
    capabilities: [brand.identity]
    description: Creates a brand kit with a tagline, color palette, fonts and tone of voice.

  webforge:
    name: Site builder
    org: WebForge
    label: sitebuilder
    domain: webforge.xyz
    version: 1.0.0
    port: 8003
    role: vendor
    capabilities: [site.generate]
    description: Turns a brand kit into a one-page landing site.

  sitesmith:
    name: Backup site builder
    org: SiteSmith
    label: sitebuilder
    domain: sitesmith.xyz
    version: 1.0.0
    port: 8004
    role: vendor
    capabilities: [site.generate]
    description: Turns a brand kit into a one-page landing site.

  compliance:
    name: Compliance agent
    org: LegalCheck
    label: compliance
    domain: legalcheck.xyz
    version: 1.0.0
    port: 8005
    role: vendor
    capabilities: [compliance.review]
    description: Reviews websites for missing disclaimers, accessibility basics and risky claims.

  shield:
    name: Shield Security
    org: ShieldSec
    label: shield
    domain: shieldsec.xyz
    version: 1.0.0
    port: 8007
    role: vendor
    capabilities: [security.review, secrets.review, dependency.audit, deployment.review]
    description: Reviews mission artifacts for secrets, vulnerabilities, dependency risks and insecure configs.

  imagescout:
    name: Image Scout
    org: ImageScout
    label: imagescout
    domain: imagescout.xyz
    version: 1.0.0
    port: 8008
    role: vendor
    capabilities: [image.search, web.research]
    description: Discovers high-resolution imagery and public web research assets for the mission.

  rightscheck:
    name: Rights Check
    org: RightsCheck
    label: rightscheck
    domain: rightscheck.xyz
    version: 1.0.0
    port: 8009
    role: vendor
    capabilities: [image.license_review]
    description: Inspects media licenses, copyright clearances, and usage rights for creative assets.

  impostor:
    name: Impostor
    org: Unknown
    port: 8006
    role: impostor
    impersonates: brand
    pitch: Half price, delivered instantly.

# Rules the Commander applies on top of ANS identity checks.
policy:
  # Only hire agents whose domain is on this list.
  allowed_domains:
    - launchpad.xyz
    - brandstudio.xyz
    - webforge.xyz
    - sitesmith.xyz
    - legalcheck.xyz
    - shieldsec.xyz
    - imagescout.xyz
    - rightscheck.xyz
  # Approved versions, keyed by agent label (or host). A different version pauses the mission
  # for approval. Labels rather than hosts, so the pin survives moving to a real domain.
  version_pins:
    compliance: "1.0"
  # Order to try vendors in when several can do the same job. Agent keys, resolved to hosts at
  # runtime — a domain list would stop meaning anything once everyone shares one apex.
  preferred_vendors:
    - brand
    - webforge
    - sitesmith
    - compliance
    - shield
    - imagescout
    - rightscheck

  # What a hired agent may DO while it works, per kind of job. Passing the Trust Gate gets an
  # agent through the door; this is what it is allowed to touch once inside. The Guardian
  # denies anything not on the list for its job — no exceptions, no matter who the agent is.
  # Scopes read as "<action>:<where or what>".
  job_scopes:
    brand.identity:
      - mission.read:brief
      - artifact.write:mission
    site.generate:
      - mission.read:brand_kit
      - artifact.write:mission
      - http.fetch:fonts.googleapis.com
      # Granted, but outward-facing: the Guardian still stops and asks a human every time.
      - site.publish:site
    compliance.review:
      - mission.read:site
      - artifact.write:mission
    security.review:
      - mission.read:artifacts
      - artifact.write:mission
    secrets.review:
      - mission.read:artifacts
      - artifact.write:mission
    dependency.audit:
      - mission.read:artifacts
      - artifact.write:mission
    deployment.review:
      - mission.read:artifacts
      - artifact.write:mission
    image.search:
      - mission.read:brief
      - artifact.write:mission
    image.license_review:
      - mission.read:images
      - artifact.write:mission
    web.research:
      - mission.read:brief
      - artifact.write:mission

  # Which brain each kind of work uses. LLM_MODE in .env overrides all of it: LLM_MODE=offline
  # makes the whole system deterministic for rehearsals, LLM_MODE=gemini forces the model
  # everywhere. Without a GEMINI_API_KEY everything is offline regardless.
  llm:
    # Free text into a structured plan is the genuinely model-shaped task here.
    mission.plan: gemini
    # Creative, subjective, cheap, and the variety per run makes the demo feel alive.
    brand.identity: gemini
    # The page is the artifact a judge looks at. The template is fast, polished and identical
    # every time; a model might hand us something ugly thirty seconds before judging.
    site.generate: offline
    # Good at reading a page for problems — and the rule checks below it are never skipped.
    compliance.review: gemini
    security.review: gemini
    secrets.review: gemini
    dependency.audit: offline
    deployment.review: gemini
    image.search: gemini
    image.license_review: gemini
    web.research: gemini
    orchestrator.select_candidate: gemini
    orchestrator.refusal: gemini
    orchestrator.supervise: gemini

  # A grant is not a permanent hire. It covers one mission and then it lapses.
  grant_ttl_seconds: 900

  # The only hosts the Guardian will reach on an agent's behalf, whatever a scope claims.
  # Agents have no outbound path of their own: network actions go through the Guardian.
  outbound_allowlist:
    - fonts.googleapis.com
